name: Keep Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: curl -s https://spa-backend-mvb1.onrender.com/health
      - name: Ping Frontend
        run: curl -s https://spa-frontend.onrender.com/
